# Konfigurace detektorů pro gamma spektroskopii - CHANNEL-CENTRIC VERSION
# Verze 2.0: Používá kanálové indexy pro ROI a channel mapping pro kalibraci

CeBr3:
  # Channel mapping pro rebinning (ch_ref = a0 + a1 * ch_sample)
  channel_mapping:
    ref_a0: 0.0           # Identity mapping - žádný offset
    ref_a1: 1.0           # Identity mapping - gain 1:1
  
  # Energetická kalibrace POUZE pro zobrazení (osy, tooltips)
  display_calibration:
    a0: 9.6229            # Intercept [keV] - jen pro display
    a1: 1.3793            # Slope [keV/kanál] - jen pro display
    a2: 0.0               # Kvadratický člen [keV/kanál²] - jen pro display
  
  standard_activities:
    Ra: 1001.4            # Aktivita Ra-226 etalonu [Bq]
    K: 11505           # Aktivita K-40 etalonu [Bq]
    Th: 1020.0            # Aktivita Th-232 etalonu [Bq]
  
  # ROI ranges v KANÁLECH (ne keV!)
  # Vypočteno: ch = (keV - a0) / a1
  roi_ranges:
    roi1: [138, 573]      # Ra/Th region (~200-800 keV)
    roi2: [504, 1182]     # K-40 region (~700-1640 keV)
  
  # Peak analysis configuration for Ra-226 @ 186 keV
  peak_analysis:
    ra_186_energy: 186.0    # Energy of Ra-226 photopeak [keV]
    roi_half_width: 15      # Half-width of integration ROI [channels]
    search_width: 10        # Width for peak search around expected position [channels]
    smooth_window: 5        # Window size for spectrum smoothing (odd number)
    bg_margin: 5            # Channels at each edge for background estimation
    ra_186_correction: 0.575  # U-235 interference correction (57.5% Ra-226)
  
  processing:
    cut_channel_left: 0   # Levý cutoff kanál (pod tímto se data vynulují)
    cut_channel_right: 2048  # Pravý cutoff kanál
  
  calibration_spectra:
    Ra: "app/data/calibration/Ra_CeBr.SPE"   # Ra-226 kalibrační spektrum
    K: "app/data/calibration/K_CeBr.SPE"     # K-40 kalibrační spektrum
    Th: "app/data/calibration/Th_CeBr.SPE"   # Th-232 kalibrační spektrum
    BG: "app/data/calibration/BG_CeBr.SPE"   # Pozadí detektoru

NaI(Tl):
  # Channel mapping pro rebinning
  channel_mapping:
    ref_a0: 0.0
    ref_a1: 1.0
  
  # Energetická kalibrace POUZE pro zobrazení
  display_calibration:
    a0: 9.6229            # TODO: Změřit správné hodnoty pro NaI(Tl)
    a1: 1.3793
    a2: 0.0
  
  standard_activities:
    Ra: 1001.4            # TODO: Ověřit aktivity etalonů pro NaI(Tl)
    K: 21330.0
    Th: 1020.0
  
  # ROI ranges v KANÁLECH
  roi_ranges:
    roi1: [170, 1030]     # Ra/Th region
    roi2: [500, 1245]     # K-40 region
  
  # Peak analysis configuration for Ra-226 @ 186 keV
  peak_analysis:
    ra_186_energy: 186.0    # Energy of Ra-226 photopeak [keV]
    roi_half_width: 15      # Half-width of integration ROI [channels]
    search_width: 10        # Width for peak search around expected position [channels]
    smooth_window: 5        # Window size for spectrum smoothing (odd number)
    bg_margin: 5            # Channels at each edge for background estimation
    ra_186_correction: 0.575  # U-235 interference correction (57.5% Ra-226)
  
  # Pre-calibrated 186 keV peak area (from calibrate_186_peak.py)
  peak_calibration:
    ra_186_net_cps_per_bq: 0.003165  # Net CPS per Bq for Ra-226 @ 186 keV
    ra_186_roi: [113, 143]           # ROI channels used for calibration
  
  processing:
    cut_channel_left: 0
    cut_channel_right: 2048
  
  calibration_spectra:
    Ra: "app/data/calibration/Ra_NaI.SPE"
    K: "app/data/calibration/K_NaI.SPE"
    Th: "app/data/calibration/Th_NaI.SPE"
    BG: "app/data/calibration/BG_NaI.SPE"    # Pozadí detektoru
