# Konfigurace detektorů pro gamma spektroskopii
# Obsahuje kalibrační parametry, aktivity etalonů a cesty ke kalibračním spektrům

CeBr3:
  calibration:
    ref_a0: 9.6229        # Referenční kalibrace - intercept [keV]
    ref_a1: 1.3793        # Referenční kalibrace - slope [keV/kanál]
    ref_a2: 0.0           # Referenční kalibrace - kvadratický člen [keV/kanál²]
  
  standard_activities:
    Ra: 1001.4            # Aktivita Ra-226 etalonu [Bq]
    K: 21330.0            # Aktivita K-40 etalonu [Bq]
    Th: 1020.0            # Aktivita Th-232 etalonu [Bq]
  
  roi_ranges:
    roi1: [200, 800]      # Ra/Th region [keV]
    roi2: [700, 1640]     # K-40 region [keV]
  
  processing:
    cut_channel_left: 0   # Levý cutoff kanál (pod tímto se data vynulují)
    cut_channel_right: 2048  # Pravý cutoff kanál
  
  calibration_spectra:
    Ra: "data/calibration/Ra_CeBr.SPE"   # Ra-226 kalibrační spektrum
    K: "data/calibration/K_CeBr.SPE"     # K-40 kalibrační spektrum
    Th: "data/calibration/Th_CeBr.SPE"   # Th-232 kalibrační spektrum

NaI(Tl):
  calibration:
    ref_a0: 9.6229        # TODO: Změřit správné hodnoty pro NaI(Tl)
    ref_a1: 1.3793
    ref_a2: 0.0
  
  standard_activities:
    Ra: 1001.4            # TODO: Ověřit aktivity etalonů pro NaI(Tl)
    K: 21330.0
    Th: 1020.0
  
  roi_ranges:
    roi1: [200, 2800]      # Ra/Th region [keV]
    roi2: [700, 1640]     # K-40 region [keV]
  
  processing:
    cut_channel_left: 0
    cut_channel_right: 2048
  
  calibration_spectra:
    Ra: "data/calibration/Ra_NaI.SPE"
    K: "data/calibration/K_NaI.SPE"
    Th: "data/calibration/Th_NaI.SPE"
